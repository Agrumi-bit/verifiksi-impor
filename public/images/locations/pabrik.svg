<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Ilustrasi bangunan pabrik">
  <defs>
    <linearGradient id="pabrik-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e6dd" />
      <stop offset="100%" stop-color="#e9d3c4" />
    </linearGradient>
    <linearGradient id="pabrik-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a68f80" />
      <stop offset="100%" stop-color="#8a7565" />
    </linearGradient>
  </defs>

  <rect width="400" height="220" fill="url(#pabrik-sky)" />
  <rect x="0" y="188" width="400" height="32" fill="#d8c3b3" />

  <!-- smoke wisps -->
  <g fill="#c7b3a3" fill-opacity="0.6">
    <circle cx="322" cy="34" r="10" />
    <circle cx="334" cy="24" r="12" />
    <circle cx="348" cy="16" r="10" />
  </g>

  <!-- chimney -->
  <rect x="312" y="44" width="20" height="76" fill="#6b5847" />
  <rect x="309" y="40" width="26" height="8" fill="#4a3c30" />

  <!-- main factory body -->
  <rect x="40" y="116" width="270" height="72" fill="url(#pabrik-wall)" />

  <!-- sawtooth north-light roof -->
  <polygon points="40,116 40,92 72,116 72,92 104,116 104,92 136,116 136,92 168,116 168,92 200,116 200,92 232,116 232,92 264,116 264,92 296,116 296,92 310,116"
    fill="#6b5847" />
  <g fill="#f7ede6" fill-opacity="0.55">
    <rect x="44" y="100" width="20" height="12" />
    <rect x="108" y="100" width="20" height="12" />
    <rect x="172" y="100" width="20" height="12" />
    <rect x="236" y="100" width="20" height="12" />
  </g>

  <!-- side pipe / tank -->
  <rect x="18" y="150" width="16" height="38" rx="4" fill="#7c6858" />
  <circle cx="26" cy="146" r="9" fill="#7c6858" />
  <rect x="34" y="164" width="10" height="6" fill="#e0662e" />

  <!-- large bay door -->
  <rect x="150" y="140" width="60" height="48" rx="2" fill="#4a3c30" />
  <g stroke="#e0662e" stroke-width="3" stroke-opacity="0.6">
    <line x1="152" y1="150" x2="208" y2="150" />
    <line x1="152" y1="160" x2="208" y2="160" />
    <line x1="152" y1="170" x2="208" y2="170" />
    <line x1="152" y1="180" x2="208" y2="180" />
  </g>

  <!-- windows -->
  <g fill="#f7ede6" fill-opacity="0.8">
    <rect x="60" y="152" width="24" height="20" rx="1.5" />
    <rect x="228" y="152" width="24" height="20" rx="1.5" />
    <rect x="266" y="152" width="24" height="20" rx="1.5" />
  </g>

  <!-- ground pallet stack -->
  <g fill="#c1440e" fill-opacity="0.5">
    <rect x="252" y="180" width="30" height="8" />
    <rect x="256" y="172" width="22" height="8" />
  </g>
</svg>
