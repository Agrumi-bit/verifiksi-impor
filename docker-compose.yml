services:
  app:
    image: ghcr.io/agrumi-bit/verifiksi-impor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/verifikasi_impor?schema=public
      STORAGE_ROOT: /app/storage
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  migrate:
    image: ghcr.io/agrumi-bit/verifiksi-impor-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/verifikasi_impor?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: verifikasi_impor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: ghcr.io/agrumi-bit/verifiksi-impor-caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Daily disk housekeeping: removes Docker images/build cache unused for 72h (old app versions left
  # behind by each deploy). Never touches volumes — postgres_data / app_storage / caddy_* are safe.
  cleaner:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[cleaner] $$(date -u) pruning images/build cache older than 72h"
          docker image prune -a -f --filter "until=72h"
          docker builder prune -a -f --filter "until=72h"
          sleep 86400
        done

  # Daily PostgreSQL backup (gzip pg_dump) into the db_backups volume; keeps the last 14 days.
  # Also runs once right after every deploy/restart.
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/verifikasi_impor_$$(date -u +%Y-%m-%d_%H%M).sql.gz
          if pg_dump -h postgres -U postgres verifikasi_impor | gzip > "$$f.tmp"; then
            mv "$$f.tmp" "$$f"; echo "[db-backup] saved $$f"
          else
            rm -f "$$f.tmp"; echo "[db-backup] FAILED"
          fi
          find /backups -name 'verifikasi_impor_*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  postgres_data:
  app_storage:
  caddy_data:
  caddy_config:
  db_backups:
