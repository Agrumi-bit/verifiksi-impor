name: Build, publish, and deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Compute lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest,${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrator
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-migrate:latest,${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-caddy:latest,${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-caddy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fail early and clearly if a required secret/variable is missing or was
      # added in the wrong place. In particular, HOSTINGER_VM_ID must be a
      # repository *Variable* — if it is stored as a Secret, `vars.HOSTINGER_VM_ID`
      # resolves to empty and the deploy action aborts with a bare "exit 1".
      - name: Preflight - deploy config present
        run: |
          missing=0
          check() { if [ -z "$2" ]; then echo "::error::$1 is empty or unset"; missing=1; fi; }
          check "secret HOSTINGER_API_KEY"  "${{ secrets.HOSTINGER_API_KEY }}"
          check "variable HOSTINGER_VM_ID"  "${{ vars.HOSTINGER_VM_ID }}"
          check "secret POSTGRES_PASSWORD"  "${{ secrets.POSTGRES_PASSWORD }}"
          check "secret BETTER_AUTH_SECRET" "${{ secrets.BETTER_AUTH_SECRET }}"
          exit $missing

      - name: Deploy to Hostinger VPS
        # Pinned to the v2 tag's commit so a moved tag cannot change deploy behaviour silently.
        uses: hostinger/deploy-on-vps@b0868cec74bfa63af6bfa7bdb0dfee2f9bef13ea # v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: verifikasi_impor
          docker-compose-path: docker-compose.yml
          environment-variables: |
            IMAGE_TAG=${{ github.sha }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=https://verifikasiimpor.online
            NEXT_PUBLIC_APP_URL=https://verifikasiimpor.online
